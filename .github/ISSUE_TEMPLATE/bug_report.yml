name: Bug report
description: Something isn't working the way it should.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the lock screen
        2. Click on Gollum's house
        3. ...
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Desktop, Tablet, Phone]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 142, Safari 19, ...
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
      description: Drag images in, or paste errors from the browser console.
