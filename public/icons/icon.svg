<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Full-bleed app icon: the MonoChrome mark on a black square (platforms round the corners themselves). -->
  <defs>
    <clipPath id="l"><rect x="0" y="0" width="32" height="64"/></clipPath>
    <clipPath id="r"><rect x="32" y="0" width="32" height="64"/></clipPath>
    <g id="bars" transform="rotate(-17 32 32)">
      <rect x="18.5" y="28" width="6" height="18" rx="1.2"/>
      <rect x="29" y="14" width="6" height="32" rx="1.2"/>
      <rect x="39.5" y="21" width="6" height="25" rx="1.2"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#050506"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#f2f2f2" stroke-width="2"/>
  <circle cx="32" cy="32" r="25" fill="#f2f2f2" clip-path="url(#r)"/>
  <use href="#bars" fill="#f2f2f2" clip-path="url(#l)"/>
  <use href="#bars" fill="#050506" clip-path="url(#r)"/>
</svg>
